<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FlowState</title>
    <script>
      // GitHub Pages 404 handler for client-side routing
      // This script takes the current URL and redirects to the main page
      // with the path encoded as a query parameter
      const pathSegmentsToKeep = 1;
      const location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + 
        (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + 
        '/?/' +
        location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
</head>
<body>
    <noscript>
        <p>This site requires JavaScript to be enabled.</p>
    </noscript>
</body>
</html>
