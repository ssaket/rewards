<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FlowState</title>
    <script>
      // GitHub Pages 404 handler for client-side routing
      // This script takes the current URL and redirects to the main page
      // with the path encoded as a query parameter
      (function() {
        const pathSegmentsToKeep = 1;
        const loc = window.location;
        loc.replace(
          loc.protocol + '//' + loc.hostname + 
          (loc.port ? ':' + loc.port : '') +
          loc.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + 
          '/?/' +
          loc.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (loc.search ? '&' + loc.search.slice(1).replace(/&/g, '~and~') : '') +
          loc.hash
        );
      })();
    </script>
</head>
<body>
    <noscript>
        <p>This site requires JavaScript to be enabled.</p>
    </noscript>
</body>
</html>
